plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'com.github.spotbugs' version '6.0.26'
    id 'com.vanniktech.maven.publish' version '0.30.0'
}

group = 'com.vaultsandbox'
version = '0.9.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Bouncy Castle for post-quantum crypto (ML-KEM, ML-DSA included in 1.79+)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.83'

    // OkHttp for HTTP and SSE
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'

    // Gson for JSON
    implementation 'com.google.code.gson:gson:2.13.2'

    // SLF4J API (compile-time dependency - consumers can bind any implementation)
    api 'org.slf4j:slf4j-api:2.0.16'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.mockito:mockito-core:5.14.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'io.github.cdimascio:dotenv-java:3.0.0'
    testImplementation 'com.sun.mail:jakarta.mail:2.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.12'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'integration'
    }

    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed'
    }

    // Pass system property to enable disabled tests if specified
    if (project.hasProperty('runDisabled')) {
        systemProperty 'junit.jupiter.conditions.deactivate', 'org.junit.*DisabledCondition'
    }

    // Integration tests must run after unit tests
    shouldRunAfter tasks.named('test')
}

// JaCoCo configuration
jacoco {
    toolVersion = "0.8.11"
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    reports {
        xml.required = true
        html.required = true
    }
}

// Combined coverage report for both unit and integration tests
tasks.register('jacocoFullReport', JacocoReport) {
    description = 'Generates coverage report for all tests (unit + integration).'
    group = 'verification'

    dependsOn tasks.named('test'), tasks.named('integrationTest')

    executionData fileTree(dir: "${buildDir}/jacoco", includes: ['*.exec'])
    sourceSets sourceSets.main

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/full/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/full/jacocoFullReport.xml')
    }
}

// Spotless configuration (code formatting)
spotless {
    java {
        googleJavaFormat('1.19.2')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    // Don't run spotlessCheck as part of 'check' task - run manually with spotlessCheck/spotlessApply
    enforceCheck = false
}


// Checkstyle configuration (style enforcement)
checkstyle {
    toolVersion = '10.20.1'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    // Fail on CI, warn locally
    ignoreFailures = !System.getenv('CI')?.toBoolean()
}

// SpotBugs configuration (bug detection)
spotbugs {
    toolVersion = '4.8.6'
    ignoreFailures = false
    excludeFilter = file("${rootDir}/config/spotbugs/exclude.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
    reports {
        html.required = true
        xml.required = false
    }
}

// Javadoc configuration
javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.memberLevel = JavadocMemberLevel.PUBLIC
    options.links = ['https://docs.oracle.com/en/java/javase/21/docs/api/']
}

// Maven Central publishing configuration
mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    coordinates(group.toString(), 'client', version.toString())

    pom {
        name = 'VaultSandbox Java Client'
        description = 'Java client library for VaultSandbox API'
        url = 'https://github.com/vaultsandbox/client-java'
        inceptionYear = '2025'

        licenses {
            license {
                name = 'Apache License 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0'
            }
        }

        developers {
            developer {
                id = 'vaultsandbox'
                name = 'Antero'
                email = 'vaultsandbox@gmail.com'
            }
        }

        scm {
            url = 'https://github.com/vaultsandbox/client-java'
            connection = 'scm:git:git://github.com/vaultsandbox/client-java.git'
            developerConnection = 'scm:git:ssh://git@github.com/vaultsandbox/client-java.git'
        }
    }
}
